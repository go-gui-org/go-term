name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 3 * * 1"  # weekly, Monday 03:07 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Vet
        working-directory: go-term
        run: go vet ./...

      - name: Build falcon
        working-directory: go-term
        run: go build -tags prod ./examples/falcon

      - name: Test
        working-directory: go-term
        run: go test -race -count=1 ./...

  macos-test:
    runs-on: macos-latest
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          brew install \
            sdl2 \
            freetype \
            harfbuzz \
            pango \
            fontconfig \
            glib \
            hunspell

      - name: Vet
        working-directory: go-term
        run: go vet ./...

      - name: Build falcon
        working-directory: go-term
        run: go build -tags prod ./examples/falcon

      - name: Test
        working-directory: go-term
        run: go test -race -count=1 ./...

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      # msys2 provides the mingw gcc the GUI backend's cgo needs; without it
      # the falcon build depends on whatever the runner image happens to ship.
      # Pinned to commit 66cd2cc of the v2 tag (supply-chain hardening; bump
      # by resolving refs/tags/v2 via `git ls-remote`).
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: false
          release: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      # No system deps step: unlike the Linux/macOS jobs, nothing below the GUI
      # backend needs SDL2/freetype/harfbuzz. The ConPTY layer (pty_windows.go)
      # is pure-Go syscalls over golang.org/x/sys/windows, and go-glyph's
      # shaping stack is pure Go, so CGO_ENABLED=0 covers term/ and internal/
      # end to end. Disabling cgo also keeps these steps independent of the
      # runner image's mingw toolchain.
      - name: Vet
        working-directory: go-term
        env:
          CGO_ENABLED: "0"
        run: go vet ./term/... ./internal/...

      - name: Build
        working-directory: go-term
        env:
          CGO_ENABLED: "0"
        run: go build ./term/... ./internal/...

      # Runs the real ConPTY code path — pty_windows.go spawns a child through
      # a pseudoconsole on the runner. No -race: the Linux and macOS jobs cover
      # the race detector, and enabling it here would reintroduce the gcc
      # dependency that CGO_ENABLED=0 avoids.
      - name: Test
        working-directory: go-term
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./term/... ./internal/...

      # The GUI backend needs cgo (go-gl); gcc comes from the msys2 step
      # above. Gates merges — falcon ships Windows binaries in the release
      # workflow, so this build must stay green per PR.
      - name: Build falcon
        working-directory: go-term
        run: go build -tags prod ./examples/falcon

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go-term/go.sum
            go-term/tools/lint/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Lint
        working-directory: go-term
        run: make lint

  bench-regress:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Bench regress
        working-directory: go-term
        run: |
          go test -bench=. -count=10 -benchmem -run='^$$' ./term \
            > /tmp/bench-current.txt
          go run ./scripts/benchregress \
            -threshold 30 \
            -base .github/benchmarks/baseline.txt \
            -current /tmp/bench-current.txt

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-regress-output
          path: /tmp/bench-current.txt

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Fuzz
        working-directory: go-term
        run: |
          for fuzz in FuzzParserFeed FuzzCSIDispatch FuzzOSCDispatch FuzzDCSDispatch FuzzKittyAPC; do
            go test -fuzz="^${fuzz}$" -fuzztime=120s ./term || exit 1
          done

  fuzz-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Check parser/grid changes
        id: changed
        working-directory: go-term
        run: |
          git fetch origin main
          # The fuzz corpus targets parser sequences, but the parser writes
          # into the grid — the first fuzz run caught a putCell bug, not a
          # parser one. Gate on both layers (grid, not just grid_*: grid.go
          # itself is part of the layer).
          if git diff --name-only origin/main...HEAD | grep -qE '^term/(parser|grid)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz (parser, 30s)
        if: steps.changed.outputs.fuzz == 'true'
        working-directory: go-term
        run: |
          for fuzz in FuzzParserFeed FuzzCSIDispatch FuzzOSCDispatch FuzzDCSDispatch FuzzKittyAPC; do
            go test -fuzz="^${fuzz}$" -fuzztime=30s ./term || exit 1
          done

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout go-term
        uses: actions/checkout@v4
        with:
          path: go-term

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go-term/go.sum

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libhunspell-dev

      - name: Bench
        working-directory: go-term
        run: go test -bench=. -count=5 -benchmem ./term | tee bench.txt

      - name: Archive bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: go-term/bench.txt

      - name: Generate normalized baseline
        working-directory: go-term
        run: |
          go run ./scripts/benchregress -update < bench.txt \
            > baseline-ci.txt

      - name: Upload CI baseline
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-ci
          path: go-term/baseline-ci.txt
