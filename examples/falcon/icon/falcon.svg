      <stop offset="0" stop-color="#00507B"/><stop offset="1" stop-color="#0F003A"/>
    </linearGradient>
    <linearGradient id="bgRight" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#5C2897"/><stop offset="1" stop-color="#000834"/>
