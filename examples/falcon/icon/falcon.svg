      <stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="bgMask"><rect width="1024" height="1024" fill="url(#bgFade)"/></mask>
    <!-- r=222 (21.7%), fitted to the original artwork's alpha silhouette. -->
    <clipPath id="squircle"><rect width="1024" height="1024" rx="222" ry="222"/></clipPath>
    <linearGradient id="wingLower" gradientUnits="userSpaceOnUse" x1="195.7" y1="908.1" x2="333.5" y2="418.4">
