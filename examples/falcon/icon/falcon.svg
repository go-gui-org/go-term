  <defs>
    <!-- Four-corner bilinear background, least-squares fitted to the pre-vector
         raster over 206796 masked samples (residual 5.74/255). SVG has no
         bilinear gradient: two vertical ramps cross-faded by a horizontal mask
         is bilinear exactly. These four colours are the whole background. -->
